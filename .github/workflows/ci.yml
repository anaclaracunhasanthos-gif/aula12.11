name: Verificações do MVP
on:
  pull_request:
  push:
    branches: [feat/universo-if-avalia-mvp]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/validar_catalogo.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Guardar build para revisão privada (sem publicar)
        uses: actions/upload-artifact@v4
        with:
          name: universo-if-avalia-primeiro-frontend
          path: dist
          retention-days: 14
