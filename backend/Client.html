<script>const qs=s=>document.querySelector(s);function bootVote(id){google.script.run.withSuccessHandler(p=>{qs('#project').textContent=p.titulo+' · '+p.modalidade;}).withFailureHandler(e=>qs('#project').textContent=e.message).getProjectForUi(id);const labels=[['criatividade','Criatividade e inovação','30%'],['clareza','Clareza da apresentação','30%'],['relevancia','Relevância e impacto','25%'],['demonstracao','Demonstração e resultados','15%']];qs('#criteria').innerHTML=labels.map(([k,l,w])=>`<div class="criterion"><strong>${l} (${w})</strong><div class="options">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${k}" value="${n}" required>${n}</label>`).join('')}</div></div>`).join('');qs('#vote').addEventListener('submit',e=>{e.preventDefault();const notas={};labels.forEach(([k])=>notas[k]=Number(qs(`input[name="${k}"]:checked`)?.value));const codigo=qs('#code').value.trim();const id_requisicao=crypto.randomUUID();qs('#message').textContent='Enviando…';google.script.run.withSuccessHandler(r=>{qs('#message').className='success';qs('#message').textContent=`Avaliação recebida. Recibo: ${r.id_requisicao} · Nota: ${r.nota.toFixed(2)}`;qs('#vote').reset();}).withFailureHandler(err=>{qs('#message').className='error';qs('#message').textContent=err.message;}).submitVote({codigo,id_projeto:id,notas,id_requisicao});});}function bootRanking(){const load=()=>{qs('#results').textContent='Carregando…';google.script.run.withSuccessHandler(rows=>{qs('#results').innerHTML=rows.map(r=>`<div class="rank"><strong>${r.posicao?'#'+r.posicao:'Aguardando amostra mínima'} · ${escapeHtml(r.titulo)}</strong><small>${r.total} avaliações · Média ponderada: ${r.posicao?r.media.toFixed(2).replace('.',','):'—'}</small>${r.medias_criterios?`<small>Critérios — Criatividade ${r.medias_criterios.criatividade.toFixed(2)} · Clareza ${r.medias_criterios.clareza.toFixed(2)} · Relevância ${r.medias_criterios.relevancia.toFixed(2)} · Demonstração ${r.medias_criterios.demonstracao.toFixed(2)}</small>`:''}<small>Atualizado em ${new Date(r.atualizado_em).toLocaleString('pt-BR')}</small></div>`).join('');}).withFailureHandler(e=>qs('#results').textContent=e.message).getRankingForUi(qs('#modality').value);};qs('#modality').addEventListener('change',load);load();}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}</script>
